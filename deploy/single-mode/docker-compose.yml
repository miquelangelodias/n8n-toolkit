networks:
  # ═══════════════════════════════════════════════════════════════
  # REDES
  # ═══════════════════════════════════════════════════════════════
  proxy:
    name: proxy              # Força nome exato, sem prefixo do projeto
    external: true           # Rede criada externamente (docker network create proxy)
  backend:
    name: backend
    external: true

volumes:
  # ═══════════════════════════════════════════════════════════════
  # VOLUMES NAMED
  # ═══════════════════════════════════════════════════════════════
  data_postgres:
  data_redis:
  data_n8n:
  data_prometheus:
  data_grafana:
  data_loki:
  data_promtail:

services:
  traefik:
    image: traefik:v3.6.13 
    container_name: traefik
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [ proxy, backend ] # 2026-08-09
    ports: [ "80:80", "443:443" ]
    volumes:
      #- /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt # 2026-08-09
      - ./traefik:/etc/traefik:ro # arquivo de configuração - 2026-08-09
      - ./logs/traefik:/var/log/traefik:rw
    command:
      # ── API / Dashboard ───────────────────────
      - --api.dashboard=false
      - --api.insecure=false
      # EntryPoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      #- --entryPoints.websecure.forwardedHeaders.insecure=true
      - --entrypoints.web.http.redirections.entrypoint.permanent=true # 2026-08-09
      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375 # ALTERADO: usa o proxy em vez do socket Docker direto.
      # ── TLS / Let's Encrypt ─────────────────── # 2026-08-09
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.tls.options=tls-secure@file
      #- --entrypoints.websecure.http.tls.options=tls-secure@file
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Logs
      # 1. Access Logs (The ones Promtail/Grafana reads)
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.format=json
      - --accesslog.bufferingsize=100
      # 2. Traefik System Logs (Optional, but good for debugging Traefik itself)
      - --log.level=INFO
      - --log.format=json
      - --log.filepath=/var/log/traefik/traefik.log
      - --log.maxsize=50
      - --log.maxbackups=5
      - --log.maxage=14
      - --log.compress=true
      # Health check
      - --ping=true
      - --ping.entrypoint=traefikping
      - --entrypoints.traefikping.address=:8082
      # Prometheus metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addRoutersLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --entrypoints.metrics.address=:8081
      - --metrics.prometheus.entryPoint=metrics
      # Global
      - --global.sendAnonymousUsage=false
      - --global.checkNewVersion=false

    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      docker-socket-proxy: {condition: service_healthy}
    labels:
      - traefik.enable=false
      - logging=promtail
      - service=traefik
      - environment=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  postgres:
    image: postgres:17.6-alpine
    container_name: postgres
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    volumes:
      - data_postgres:/var/lib/postgresql/data
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    labels:
      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=postgres
      - env=production

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    volumes:
      - data_redis:/data
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
      # ── Segurança: desabilita comandos perigosos ──
      - --rename-command FLUSHALL ""
      - --rename-command FLUSHDB ""
      - --rename-command CONFIG ""
      - --rename-command DEBUG ""
      - --rename-command SHUTDOWN ""
      # ── Persistência: snapshots ──
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --protected-mode yes
    environment:
      - TZ=${TZ}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING" ]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=redis
      - env=production
  
  # n8n (single mode)
  n8n:
    image: n8nio/n8n:2.33.7-e21f9f1 # version stable 07/08/2026
    container_name: n8n
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    #user: "1000:1000"
    networks: [ proxy, backend ] 
    volumes:
      - data_n8n:/home/node/.n8n
      - ./backups:/backups
      - ./n8n_files:/files
      - ./logs/n8n:/home/node/n8n-logs
    environment:
      - NODE_OPTIONS=" --no-deprecation"
      - NODE_ENV=production
      #- N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_SECURE_COOKIE="true"
      - N8N_PUBLIC_API_DISABLED="true"
      - N8N_BLOCK_ENV_ACCESS_IN_NODE="true"
      - N8N_PUSH_BACKEND=websocket
      - N8N_PUSH_BACKEND_PING_INTERVAL=25000
      - N8N_PUSH_BACKEND_PONG_TIMEOUT=10000
      # - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      # - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      # - N8N_RUNNERS_TASK_TIMEOUT=300
      # ── Rede ──────────────────────────────────
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_PROXY_HOPS=1
      # ── Timezone ───────────────────────────────
      - GENERIC_TIMEZONE=${TZ:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}
      # ── Banco de dados ────────────────────────
      - DB_TYPE=${DB_TYPE:-postgresdb}
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=${DB_POSTGRESDB_SCHEMA:-public}
      # ── Redis ─────────────────────────────────
      - N8N_REDIS_HOST=redis
      - N8N_REDIS_PORT=6379
      - N8N_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EXECUTIONS_MODE=${EXECUTIONS_MODE:-regular}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_HEALTH_CHECK_ACTIVE=true
        # ── Métricas ──────────────────────────────
      - N8N_METRICS=true
      - N8N_METRICS_PREFIX=n8n_
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_METRICS_INCLUDE_QUEUE_METRICS=true
      - N8N_METRICS_QUEUE_METRICS_INTERVAL=5000
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_INCLUDE_NODE_TYPE_LABEL=true
      - N8N_METRICS_INCLUDE_CREDENTIAL_TYPE_LABEL=true
      - N8N_METRICS_INCLUDE_CACHE_METRICS=true
      - N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS=true
      - N8N_METRICS_INCLUDE_API_ENDPOINTS=true
      - N8N_METRICS_INCLUDE_API_PATH_LABEL=true
      - N8N_METRICS_INCLUDE_API_METHOD_LABEL=true
      - N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL=true
      - N8N_METRICS_INCLUDE_DNS_CACHE_METRICS=true
      - N8N_METRICS_INCLUDE_WEBHOOK_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_INFO=true
      # ── Logs ──────────────────────────────
      # Tell n8n to write logs to both the console and a file
      - N8N_LOG_OUTPUT=console,file
      # Set the detail level (info, debug, warn, error)
      - N8N_LOG_LEVEL=info
      # Define where the log file lives INSIDE the container
      - N8N_LOG_FILE_LOCATION=/home/node/n8n-logs/n8n.log
      # Optional: Set max log file size and rotation
      - N8N_LOG_FILE_MAXSIZE=50
      - N8N_LOG_FILE_MAXCOUNT=60
    depends_on: 
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://n8n:${N8N_PORT:-5678}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    labels:
      - traefik.enable=true
        #- traefik.docker.network=proxy
      # Router & TLS
      - traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`) && !PathPrefix(`/metrics`) # && !PathPrefix(`/healthz`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      # Bind the router to the named Traefik service defined below
      - traefik.http.routers.n8n.service=n8n
      - traefik.http.services.n8n.loadbalancer.server.port=${N8N_PORT:-5678}
      # Middlewares
      - traefik.http.routers.n8n.middlewares=n8n-headers,n8n-rate #,n8n@docker #,n8n-retry #,n8n-compress
      # Security headers
      - traefik.http.middlewares.n8n-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n-headers.headers.STSSeconds=315360000
      #- traefik.http.middlewares.n8n-headers.headers.stsSeconds=315360000
      - traefik.http.middlewares.n8n-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.n8n-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n-headers.headers.frameDeny=true
      - traefik.http.middlewares.n8n-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.n8n-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n-headers.headers.SSLHost=${N8N_HOST}
      - traefik.http.middlewares.n8n-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.n8n-headers.headers.stsPreload=true
      # Rate limiting
      - traefik.http.middlewares.n8n-rate.ratelimit.average=100
      - traefik.http.middlewares.n8n-rate.ratelimit.burst=50
      - traefik.http.middlewares.n8n-rate.ratelimit.period=3s
      # Retry & compression
      - traefik.http.middlewares.n8n-retry.retry.attempts=3
      #- traefik.http.middlewares.n8n-compress.compress=false

      ############################################################
      # Aplica middleware de tratamento de erros ao router HTTPS
      ############################################################
      - traefik.http.routers.n8n.middlewares=n8n-errors

      ############################################################
      # Middleware de erro: em caso de status 4xx/5xx, redireciona
      # o usuário para a página principal "/" do Grafana.
      ############################################################
      - traefik.http.middlewares.n8n-errors.errors.status=400-599
      - traefik.http.middlewares.n8n-errors.errors.service=n8n
      - traefik.http.middlewares.n8n-errors.errors.query=/

      - traefik.http.services.n8n.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.n8n.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.n8n.loadbalancer.healthcheck.timeout=10s
      - traefik.http.services.n8n.loadbalancer.sticky.cookie=true
      - traefik.http.services.n8n.loadbalancer.sticky.cookie.name=n8n_server
      - traefik.http.services.n8n.loadbalancer.sticky.cookie.secure=true
      - traefik.http.services.n8n.loadbalancer.sticky.cookie.httpOnly=true

      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=n8n
      - env=production
 
  # ===== Monitoring (enabled by COMPOSE_PROFILES=monitoring) =====
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ proxy, backend ]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - data_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=5GB
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    labels:
      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=prometheus
      - env=production

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.4.6-ubuntu
    container_name: grafana
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [ proxy, backend ] 
    volumes:
      - data_grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:rw
      - ./grafana/dashboards:/var/lib/grafana/dashboards 
    environment:
      - GF_SERVER_ROOT_URL=https://${GF_HOST}
      - GF_SERVER_DOMAIN=https://${GF_HOST}
      - GF_SERVER_ENFORCE_DOMAIN=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-suporte}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Desabilita funcionalidades não usadas
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      #- GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel #DEPRECIADO
      #- GF_PLUGINS_PREINSTALL=grafana-clock-panel:latest,grafana-piechart-panel:latest
      - GF_METRICS_ENABLED=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - TZ=${TZ:-America/Sao_Paulo}
    depends_on: [prometheus]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Router & TLS
      - traefik.http.routers.grafana.rule=Host(`${GF_HOST}`) && !PathPrefix(`/metrics`) # && !PathPrefix(`/healthz`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      # Bind the router to the named Traefik service defined below
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=${GRAFANA_PORT:-3000}
      - traefik.http.services.grafana.loadbalancer.healthcheck.path=/api/health

      # Middlewares
      - traefik.http.routers.grafana.middlewares=grafana-headers,grafana-rate #,grafana@docker #,grafana-retry #,grafana-compress
      # Security headers
      - traefik.http.middlewares.grafana-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.grafana-headers.headers.STSSeconds=315360000
      #- traefik.http.middlewares.grafana-headers.headers.stsSeconds=315360000
      - traefik.http.middlewares.grafana-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.grafana-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.grafana-headers.headers.frameDeny=true
      - traefik.http.middlewares.grafana-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.grafana-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.grafana-headers.headers.SSLHost=(`${GF_HOST}`)
      - traefik.http.middlewares.grafana-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.grafana-headers.headers.stsPreload=true
      # Rate limiting
      - traefik.http.middlewares.grafana-rate.ratelimit.average=100
      - traefik.http.middlewares.grafana-rate.ratelimit.burst=50
      - traefik.http.middlewares.grafana-rate.ratelimit.period=3s
      # Retry & compression
      - traefik.http.middlewares.grafana-retry.retry.attempts=3
      #- traefik.http.middlewares.grafana-compress.compress=false
      #  Router para métricas (Prometheus) 
      #- traefik.http.routers.grafana-metrics.rule=Host(`dashboard.${DOMAIN}`)&& !PathPrefix(`/metrics`) # && !PathPrefix(`/healthz`)
      #- traefik.http.routers.grafana-metrics.entrypoints=websecure
      #- traefik.http.routers.grafana-metrics.tls=true
      #- traefik.http.routers.grafana-metrics.service=grafana
      #--entryPoints.websecure.forwardedHeaders.insecure

      ############################################################
      # Aplica middleware de tratamento de erros ao router HTTPS
      ############################################################
      - traefik.http.routers.grafana.middlewares=grafana-errors

      ############################################################
      # Middleware de erro: em caso de status 4xx/5xx, redireciona
      # o usuário para a página principal "/" do Grafana.
      ############################################################
      - traefik.http.middlewares.grafana-errors.errors.status=400-599
      - traefik.http.middlewares.grafana-errors.errors.service=grafana
      - traefik.http.middlewares.grafana-errors.errors.query=/


      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=grafana
      - env=production
    
  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    #privileged: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE                # necessário para cAdvisor
      - DAC_READ_SEARCH
    devices:
      - /dev/kmsg
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    labels:
      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=cadvisor
      - env=production

  node-exporter:
    profiles: ["monitoring"]
    #pid: "host"
    image: prom/node-exporter:v1.10.2
    container_name: node_exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    labels:
      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=nodeexporter
      - env=production
 
  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.6.10
    container_name: loki
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    expose:
      - "3100"
      - "9096"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - data_loki:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    labels:
      # ── promtail ──────────────────────────────────
      - logging=promtail
      - service=loki
      - env=production

  promtail:
    profiles: ["monitoring"]
    #user: "1000:1000"
    user: "0:0"
    image: grafana/promtail:3.6.10
    container_name: promtail
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    volumes:
      - data_promtail:/tmp
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./logs/traefik:/log_traefik:ro
    command: -config.file=/etc/promtail/config.yaml
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on: 
      loki: {condition: service_healthy}
      docker-socket-proxy: {condition: service_healthy}
    labels:
      - service=promtail
      - env=production

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [ backend ]
    expose: [ "2375" ] # exposto apenas na rede interna
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # ── Volume com socket somente leitura ──
    environment:
      # ── Essenciais (Promtail + Traefik) ──
      CONTAINERS: 1   # Permite listar contêineres
      NETWORKS: 1     # Permite ler informações de rede (resolve erro de network labels)
      EVENTS: 1       # Permite monitorar criação/remoção de contêineres em tempo real
      # ── ADICIONADO para Traefik (se usar endpoint do proxy): ──
      INFO: 1         # ← ADICIONADO: Traefik precisa do /version e /info
      VERSION: 1      # ← ADICIONADO: Traefik verifica versão do Docker API
      PING: 1         # ← ADICIONADO: healthcheck do provider
      # ── Bloqueados  ──
      SERVICES: 0
      TASKS: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0                     # crítica: impede docker exec remoto
      GRPC: 0
      PLUGINS: 0
      POST: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
    tmpfs:
      - /tmp              # ← ADICIONADO: filesystem temporário
    #read_only: true               # filesystem somente leitura
    cap_drop:
      - ALL                       # remove todas as capabilities
    # ── Resiliência ──
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2375/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels: # ── Labels para observabilidade ──
      - service=docker-socket-proxy
      - environment=production
      - logging=promtail

